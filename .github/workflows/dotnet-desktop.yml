name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build Release
        run: dotnet build 'ReShade Centralized.sln' --configuration Release

      - name: Publish release
        run: ./Publish.ps1

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ReShade-Centralized-win-x64
          path: release/*
          if-no-files-found: error
