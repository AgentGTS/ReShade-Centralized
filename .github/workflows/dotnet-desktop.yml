name: Build and test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build Release
        run: dotnet build 'ReShade Centralized.sln' --configuration Release

      - name: Run tests
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          dotnet run --project Tests/ReShadeCentralized.Tests.csproj --configuration Release --no-build 2>&1 |
            Tee-Object -FilePath artifacts/test-output.log
          exit $LASTEXITCODE

      - name: Package build
        run: ./Publish.ps1

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ReShade-Centralized-win-x64
          path: artifacts/*.zip
          if-no-files-found: error

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: artifacts/test-output.log
          if-no-files-found: ignore
